apiVersion: core.authentik.crossplane.io/v1alpha1
kind: TaskSchedule
metadata:
  annotations:
    meta.upbound.io/example-id: core/v1alpha1/taskschedule
  labels:
    testing.upbound.io/example-name: default
  name: default
spec:
  forProvider:
    appModel: authentik_providers_scim.scimprovider
    crontab: 6 */4 * * 2
    modelId: ${authentik_provider_scim.name.id}

---

apiVersion: provider.authentik.crossplane.io/v1alpha1
kind: SCIMProvider
metadata:
  annotations:
    meta.upbound.io/example-id: core/v1alpha1/taskschedule
  labels:
    testing.upbound.io/example-name: name
  name: name
spec:
  forProvider:
    name: name
    tokenSecretRef:
      key: example-key
      name: example-secret
      namespace: upbound-system
    url: http://localhost
