apiVersion: core.authentik.m.crossplane.io/v1alpha1
kind: CertificateKeyPair
metadata:
  annotations:
    meta.upbound.io/example-id: core/v1alpha1/certificatekeypair
  labels:
    testing.upbound.io/example-name: name
  name: name
  namespace: crossplane-system
spec:
  forProvider:
    certificateData: ${tls_self_signed_cert.example.cert_pem}
    keyDataSecretRef:
      key: attribute.private_key_pem
      name: example-private-key
    name: keypair
