apiVersion: core.authentik.m.crossplane.io/v1alpha1
kind: Group
metadata:
  annotations:
    meta.upbound.io/example-id: core/v1alpha1/group
  labels:
    testing.upbound.io/example-name: group
  name: group
  namespace: crossplane-system
spec:
  forProvider:
    isSuperuser: true
    name: tf_admins
    usersRefs:
    - name: name

---

apiVersion: core.authentik.m.crossplane.io/v1alpha1
kind: User
metadata:
  annotations:
    meta.upbound.io/example-id: core/v1alpha1/group
  labels:
    testing.upbound.io/example-name: name
  name: name
  namespace: crossplane-system
spec:
  forProvider:
    name: User
    username: user
