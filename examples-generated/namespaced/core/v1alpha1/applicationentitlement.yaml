apiVersion: core.authentik.m.crossplane.io/v1alpha1
kind: ApplicationEntitlement
metadata:
  annotations:
    meta.upbound.io/example-id: core/v1alpha1/applicationentitlement
  labels:
    testing.upbound.io/example-name: ent
  name: ent
  namespace: crossplane-system
spec:
  forProvider:
    applicationSelector:
      matchLabels:
        testing.upbound.io/example-name: name
    name: test-ent

---

apiVersion: core.authentik.m.crossplane.io/v1alpha1
kind: Application
metadata:
  annotations:
    meta.upbound.io/example-id: core/v1alpha1/applicationentitlement
  labels:
    testing.upbound.io/example-name: name
  name: name
  namespace: crossplane-system
spec:
  forProvider:
    name: example-app
    slug: example-app

---

apiVersion: core.authentik.m.crossplane.io/v1alpha1
kind: Group
metadata:
  annotations:
    meta.upbound.io/example-id: core/v1alpha1/applicationentitlement
  labels:
    testing.upbound.io/example-name: group
  name: group
  namespace: crossplane-system
spec:
  forProvider:
    name: test-ent-group

---

apiVersion: policy.authentik.m.crossplane.io/v1alpha1
kind: PolicyBinding
metadata:
  annotations:
    meta.upbound.io/example-id: core/v1alpha1/applicationentitlement
  labels:
    testing.upbound.io/example-name: test-ent-access
  name: test-ent-access
  namespace: crossplane-system
spec:
  forProvider:
    groupSelector:
      matchLabels:
        testing.upbound.io/example-name: group
    order: 0
    target: ${authentik_application_entitlement.ent.uuid}
