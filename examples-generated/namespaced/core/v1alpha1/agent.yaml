apiVersion: core.authentik.m.crossplane.io/v1alpha1
kind: Agent
metadata:
  annotations:
    meta.upbound.io/example-id: core/v1alpha1/agent
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: crossplane-system
spec:
  forProvider:
    isActive: true
    name: Example Agent
    parent: ${authentik_user.example_agent_parent.id}
    policyBehavior: mirror
    username: example-agent

---

apiVersion: core.authentik.m.crossplane.io/v1alpha1
kind: User
metadata:
  annotations:
    meta.upbound.io/example-id: core/v1alpha1/agent
  labels:
    testing.upbound.io/example-name: example_agent_parent
  name: example-agent-parent
  namespace: crossplane-system
spec:
  forProvider:
    name: Example Agent Parent
    username: example-agent-parent
