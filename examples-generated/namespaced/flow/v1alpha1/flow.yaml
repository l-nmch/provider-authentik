apiVersion: flow.authentik.m.crossplane.io/v1alpha1
kind: Flow
metadata:
  annotations:
    meta.upbound.io/example-id: flow/v1alpha1/flow
  labels:
    testing.upbound.io/example-name: flow
  name: flow
  namespace: crossplane-system
spec:
  forProvider:
    designation: authorization
    name: test-flow
    slug: test-flow
    title: Test flow

---

apiVersion: flow.authentik.m.crossplane.io/v1alpha1
kind: StageBinding
metadata:
  annotations:
    meta.upbound.io/example-id: flow/v1alpha1/flow
  labels:
    testing.upbound.io/example-name: dummy-flow
  name: dummy-flow
  namespace: crossplane-system
spec:
  forProvider:
    order: 0
    stage: ${authentik_stage_dummy.name.id}
    targetSelector:
      matchLabels:
        testing.upbound.io/example-name: flow

---

apiVersion: stage.authentik.m.crossplane.io/v1alpha1
kind: DummyStage
metadata:
  annotations:
    meta.upbound.io/example-id: flow/v1alpha1/flow
  labels:
    testing.upbound.io/example-name: name
  name: name
  namespace: crossplane-system
spec:
  forProvider:
    name: test-stage
