apiVersion: provider.authentik.m.crossplane.io/v1alpha1
kind: SAMLProvider
metadata:
  annotations:
    meta.upbound.io/example-id: provider/v1alpha1/samlprovider
  labels:
    testing.upbound.io/example-name: name
  name: name
  namespace: crossplane-system
spec:
  forProvider:
    acsUrl: http://localhost
    authorizationFlowSelector:
      matchLabels:
        testing.upbound.io/example-name: authentik_flow
    name: test-app

---

apiVersion: core.authentik.m.crossplane.io/v1alpha1
kind: Application
metadata:
  annotations:
    meta.upbound.io/example-id: provider/v1alpha1/samlprovider
  labels:
    testing.upbound.io/example-name: name
  name: name
  namespace: crossplane-system
spec:
  forProvider:
    name: test-app
    protocolProvider: ${authentik_provider_saml.name.id}
    slug: test-app
