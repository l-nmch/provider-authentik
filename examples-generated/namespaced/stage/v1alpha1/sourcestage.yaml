apiVersion: stage.authentik.m.crossplane.io/v1alpha1
kind: SourceStage
metadata:
  annotations:
    meta.upbound.io/example-id: stage/v1alpha1/sourcestage
  labels:
    testing.upbound.io/example-name: name
  name: name
  namespace: crossplane-system
spec:
  forProvider:
    name: source-stage
    source: ${authentik_source_oauth.name.id}

---

apiVersion: source.authentik.m.crossplane.io/v1alpha1
kind: OAuthSource
metadata:
  annotations:
    meta.upbound.io/example-id: stage/v1alpha1/sourcestage
  labels:
    testing.upbound.io/example-name: name
  name: name
  namespace: crossplane-system
spec:
  forProvider:
    authenticationFlowSelector:
      matchLabels:
        testing.upbound.io/example-name: authentik_flow
    consumerKey: foo
    consumerSecretSecretRef:
      key: example-key
      name: example-secret
    enrollmentFlowSelector:
      matchLabels:
        testing.upbound.io/example-name: authentik_flow
    name: discord
    providerType: discord
    slug: discord
