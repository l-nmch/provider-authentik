apiVersion: stage.authentik.m.crossplane.io/v1alpha1
kind: PromptStage
metadata:
  annotations:
    meta.upbound.io/example-id: stage/v1alpha1/promptstage
  labels:
    testing.upbound.io/example-name: name
  name: name
  namespace: crossplane-system
spec:
  forProvider:
    fields:
    - ${resource.authentik_stage_prompt_field.field.id}
    name: test

---

apiVersion: stage.authentik.m.crossplane.io/v1alpha1
kind: PromptField
metadata:
  annotations:
    meta.upbound.io/example-id: stage/v1alpha1/promptstage
  labels:
    testing.upbound.io/example-name: field
  name: field
  namespace: crossplane-system
spec:
  forProvider:
    fieldKey: username
    label: Username
    name: username
    type: username
