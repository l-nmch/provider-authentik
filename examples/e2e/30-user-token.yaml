apiVersion: core.authentik.m.crossplane.io/v1alpha1
kind: User
metadata:
  name: xptest
  namespace: xptest
spec:
  forProvider:
    username: xptest
    name: xptest user
    groupsRefs:
      - name: xptest-child
---
apiVersion: core.authentik.m.crossplane.io/v1alpha1
kind: Token
metadata:
  name: xptest
  namespace: xptest
spec:
  forProvider:
    identifier: xptest
    # authentik only returns the key when asked to
    retrieveKey: true
    userRef:
      name: xptest
  writeConnectionSecretToRef:
    name: xptest-token
