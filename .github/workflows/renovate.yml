name: Renovate

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  renovate:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@1376d90bcd3a4d4e7393ae762eea56ac684aee38 # v48.0.0
        env:
          RENOVATE_REPOSITORIES: '["l-nmch/provider-authentik"]'
        with:
          configurationFile: .github/renovate.json5
          token: '${{ secrets.RENOVATE_TOKEN }}'
